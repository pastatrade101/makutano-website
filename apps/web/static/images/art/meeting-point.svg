<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" width="400" height="440" role="img" aria-label="Converging paths meeting at a single point">
  <defs>
    <linearGradient id="mp-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102032"/>
      <stop offset="1" stop-color="#0b1522"/>
    </linearGradient>
    <radialGradient id="mp-glow" cx="50%" cy="52%" r="46%">
      <stop offset="0" stop-color="#ffbd58" stop-opacity=".42"/>
      <stop offset="1" stop-color="#ffbd58" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mp-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffbd58" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffbd58" stop-opacity=".85"/>
      <stop offset="1" stop-color="#ffbd58" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="400" height="440" fill="url(#mp-bg)"/>
  <g stroke="#ffffff" stroke-opacity=".05">
    <path d="M100 0v440M200 0v440M300 0v440M0 110h400M0 220h400M0 330h400"/>
  </g>
  <circle cx="200" cy="228" r="170" fill="url(#mp-glow)"/>

  <!-- Seven paths converging on one point: one partner, seven capabilities. -->
  <g fill="none" stroke="#ffffff" stroke-opacity=".22" stroke-width="1.2">
    <path d="M12 44C120 92 168 150 200 228"/>
    <path d="M60 8C128 84 176 148 200 228"/>
    <path d="M200 6v222"/>
    <path d="M340 8C272 84 224 148 200 228"/>
    <path d="M388 44C280 92 232 150 200 228"/>
    <path d="M6 250C88 244 156 238 200 228"/>
    <path d="M394 250C312 244 244 238 200 228"/>
  </g>

  <g fill="none" stroke="url(#mp-line)" stroke-width="1.6">
    <path d="M200 6v222"/>
    <path d="M12 44C120 92 168 150 200 228"/>
    <path d="M388 44C280 92 232 150 200 228"/>
  </g>

  <g fill="#0b1522" stroke="#ffbd58" stroke-width="1.4">
    <circle cx="12" cy="44" r="4"/><circle cx="60" cy="8" r="4"/><circle cx="200" cy="6" r="4"/>
    <circle cx="340" cy="8" r="4"/><circle cx="388" cy="44" r="4"/>
    <circle cx="6" cy="250" r="4"/><circle cx="394" cy="250" r="4"/>
  </g>

  <circle cx="200" cy="228" r="30" fill="none" stroke="#ffbd58" stroke-opacity=".35"/>
  <circle cx="200" cy="228" r="18" fill="#ffbd58"/>
  <path d="M192 228h16M200 220v16" stroke="#0b1522" stroke-width="2" stroke-linecap="round"/>

  <text x="200" y="330" fill="#ffffff" fill-opacity=".9" font-family="Outfit, system-ui, sans-serif" font-size="21" font-weight="600" text-anchor="middle" letter-spacing="-.4">Makutano</text>
  <text x="200" y="356" fill="#9aa8b8" font-family="DM Sans, system-ui, sans-serif" font-size="12" text-anchor="middle" letter-spacing="3.4">MEETING POINT</text>
  <text x="200" y="400" fill="#ffbd58" font-family="Outfit, system-ui, sans-serif" font-size="12" text-anchor="middle" letter-spacing="2">ONE PARTNER · SEVEN DOMAINS</text>
</svg>
