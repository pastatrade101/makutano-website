<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" role="img" aria-label="The seven service domains as a grid">
  <defs>
    <linearGradient id="dg-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffbd58"/>
      <stop offset="1" stop-color="#e09a2f"/>
    </linearGradient>
  </defs>

  <rect width="320" height="320" fill="url(#dg-bg)"/>
  <g stroke="#ffffff" stroke-opacity=".16">
    <path d="M80 0v320M160 0v320M240 0v320M0 80h320M0 160h320M0 240h320"/>
  </g>

  <!-- Seven filled cells, one per registered service domain. -->
  <g fill="#0b1522" fill-opacity=".82">
    <rect x="4" y="4" width="72" height="72" rx="14"/>
    <rect x="84" y="4" width="72" height="72" rx="14"/>
    <rect x="164" y="84" width="72" height="72" rx="14"/>
    <rect x="4" y="164" width="72" height="72" rx="14"/>
    <rect x="244" y="164" width="72" height="72" rx="14"/>
    <rect x="84" y="244" width="72" height="72" rx="14"/>
    <rect x="164" y="244" width="72" height="72" rx="14"/>
  </g>

  <g fill="#ffbd58" font-family="Outfit, system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">
    <text x="40" y="46">01</text><text x="120" y="46">02</text><text x="200" y="126">03</text>
    <text x="40" y="206">04</text><text x="280" y="206">05</text><text x="120" y="286">06</text>
    <text x="200" y="286">07</text>
  </g>

  <g fill="#ffffff" fill-opacity=".28">
    <circle cx="200" cy="40" r="5"/><circle cx="280" cy="120" r="5"/><circle cx="120" cy="200" r="5"/>
    <circle cx="200" cy="200" r="5"/><circle cx="40" cy="280" r="5"/><circle cx="280" cy="280" r="5"/>
  </g>
</svg>
